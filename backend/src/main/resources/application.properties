# ==========================================================
# Configuración Spring Boot - RutaIA Backend
# ==========================================================

server.port=${SERVER_PORT:8080}
spring.application.name=rutaia-backend

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/rutaia_db?sslmode=disable}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Orquestación con n8n
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5679/webhook/recomendar-cursos}

# Configuración Redis para Gestión de Sesiones y Tokens
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5000ms

# Configuración JWT (HMAC-SHA256)
jwt.secret=${JWT_SECRET:RutaIA_Super_Secret_Key_For_JWT_Authentication_2026_Secure_Key_256bits!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Configuración Qdrant Vector DB
qdrant.url=${QDRANT_URL:http://localhost:6335}
qdrant.collection=${QDRANT_COLLECTION:cursos_academicos}
qdrant.api-key=${QDRANT_API_KEY:}

# OpenRouter para Embeddings de Cursos
openrouter.api.key=${OPENROUTER_API_KEY:tu_openrouter_api_key_aqui}
openrouter.embedding.model=${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
