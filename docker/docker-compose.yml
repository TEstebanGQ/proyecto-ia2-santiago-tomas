version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rutaia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rutaia_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rutaia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rutaia_net

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rutaia_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6335}:6333"
      - "6336:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - rutaia_net

  redis:
    image: redis:7-alpine
    container_name: rutaia_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - rutaia_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: rutaia_n8n
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${N8N_PORT:-5679}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/data/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - rutaia_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: rutaia-backend:17
    container_name: rutaia_backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rutaia_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-134514735180-itup9unjaso8pr7lk8vvq9hk0bl81avm.apps.googleusercontent.com}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/recomendar-cursos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      n8n:
        condition: service_started
    networks:
      - rutaia_net
    profiles:
      - backend
      - full

volumes:
  postgres_data:
    name: rutaia_postgres_data
  qdrant_storage:
    name: rutaia_qdrant_data
  n8n_data:
    name: rutaia_n8n_data
  redis_data:
    name: rutaia_redis_data

networks:
  rutaia_net:
    name: rutaia_network
    driver: bridge
